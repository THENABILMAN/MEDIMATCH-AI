# Runs MongoDB for doctor search, and the API against local Supabase, which `make db-start` starts on this machine.
# Keys for the local stack come from `npx supabase status`, set in .env.docker.
services:
  # MongoDB with vector search. Starts alone with `docker compose up -d mongo`
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: medimatch-mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-search:/data/mongot
    mem_limit: 2500m
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      ENVIRONMENT: development
      SUPABASE_URL: http://host.docker.internal:54321
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-config:
  mongo-search:
